<!doctype html>
<!-- App Store 스크린샷 한 장: dev/store-frames.sh가 ?lang=en&scene=trips&shot=<앱 화면 주소>로 열어 1320×2868로 찍습니다.
     480×1043 CSS 픽셀로 그리고 2.75배로 찍어, 웹사이트와 같은 크기의 캐릭터 · 말풍선을 씁니다. 문구는 dev/i18n.json(웹사이트 번역표)에서 읽습니다. -->
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site.css">
<style>
  html, body { margin: 0; width: 480px; height: 1043px; overflow: hidden; }
  body { background: color-mix(in srgb, var(--theme) 14%, #fff); word-break: keep-all; }
  .frame { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; }
  .head { width: 100%; box-sizing: border-box; padding: 34px 24px 0; }
  .speaker { display: flex; align-items: flex-end; gap: 6px; margin-bottom: 0; }
  .speaker .char { flex: none; }
  .speaker .bubble { margin-bottom: 18px; font-size: 16px; max-width: none; }
  h1 { margin: 14px 0 0; font-size: 33px; font-weight: 800; line-height: 1.22; letter-spacing: -0.03em; text-wrap: balance; }
  .phone {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    width: 340px; aspect-ratio: 1320 / 2868; padding: 7px; border-radius: 46px;
    background: #1c1c1e; box-shadow: 0 18px 40px rgb(0 0 0 / 0.18), 0 0 0 1px rgb(0 0 0 / 0.12);
  }
  .phone img { display: block; width: 100%; height: 100%; border-radius: 39px; }
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <div class="speaker"><span class="char" data-size="84"></span><p class="bubble tail-left"><span class="who"></span><span class="line"></span></p></div>
    <h1></h1>
  </div>
  <figure class="phone"><img alt=""></figure>
</div>
<script type="module">
import { characterById, toSVG } from '../characters.js'

// 장면마다: 캐릭터 · 말풍선 · 제목(웹사이트 소개 페이지 문구의 한국어 원문, 번역은 i18n.json에서 찾음)
const SCENES = {
  'first-run': { char: 'moa', line: '안녕하세요! 오늘은 어떤 사진부터 정리할까요?', title: '사진 정리, <br class="narrow">모아랑 같이 해요' },
  trips: { char: 'moa', line: '여행마다 앨범을 만들어 봐요', title: '여행별로 앨범을 만들어요' },
  polish: { char: 'chalkak', line: '비슷한 사진은 한 장만 골라 봐요', title: '비슷한 사진은 한 장만 남겨요' },
  swipe: { char: 'pola', line: '넘기면서 하나씩 정해요', title: '넘기면서 정리해요' },
  videos: { char: 'rolly', line: '동영상은 지우지 말고 줄여 봐요', title: '지우지 않고 공간을 비워요' },
  quick: { char: 'rolly', line: '다 쓴 캡처부터 치워 봐요', title: '스크린샷과 중복 사진을 정리해요' },
  month: { char: 'pola', line: '이번 달은 다 끝냈어요!', title: '한 달씩 끝내요' },
  share: { char: 'chalkak', line: '여행 카드로 자랑해 봐요', title: '여행을 카드로 보내요' },
  room: { char: 'nyang', line: '저를 누르면 한마디 해요', title: '정리할수록 친구 방이 깨끗해져요' }
}
const NAMES = { moa: '모아', chalkak: '찰칵', pola: '폴라', rolly: '롤리', nyang: '냥이' }
const COLORS = { moa: 'var(--moa)', chalkak: 'var(--chalkak)', pola: 'var(--pola)', rolly: 'var(--rolly)', nyang: 'var(--nyang)' }

const params = new URLSearchParams(location.search)
const lang = params.get('lang') || 'ko'
const scene = SCENES[params.get('scene')]
const { rows, store } = await (await fetch('i18n.json')).json()
const t = ko => {
  if (lang === 'ko') return ko
  const row = [...rows, ...store].find(r => r.ko === ko)
  if (!row || row[lang] === undefined) throw new Error(`번역 없음: ${ko}`)
  return row[lang]
}

document.documentElement.lang = lang
document.documentElement.classList.add('js') // site.css는 js 없이는 캐릭터를 숨김
document.body.style.setProperty('--theme', COLORS[scene.char])
const char = document.querySelector('.char')
char.style.setProperty('--size', '84px')
char.innerHTML = toSVG(characterById(scene.char), { mood: 'cheer' })
const bubble = document.querySelector('.bubble')
if (scene.line) {
  bubble.querySelector('.who').textContent = t(`>${NAMES[scene.char]}<`).slice(1, -1)
  bubble.querySelector('.who').style.setProperty('--theme', COLORS[scene.char])
  bubble.querySelector('.line').textContent = t(scene.line)
} else bubble.remove()
document.querySelector('h1').innerHTML = t(scene.title)
const img = document.querySelector('.phone img')
img.src = params.get('shot')
await img.decode()
document.body.dataset.ready = '1'
</script>
</body>
</html>
