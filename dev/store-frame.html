<!doctype html>
<!-- App Store 스크린샷 한 장: dev/store-frames.sh가 ?lang=en&scene=trips&shot=<앱 화면 주소>[&device=duo]로 열어 찍습니다.
     웹사이트 소개 페이지(그 언어 페이지)를 같은 크기의 iframe으로 열고, 그 장면의 카드 하나만 남겨 앱 화면만 바꿉니다.
     카드 모양 · 문구 · 캐릭터는 웹사이트 그대로라 웹사이트를 고치면 스크린샷도 따라 바뀝니다.
     - 바형: 440×956 CSS 픽셀(휴대폰 폭 배치: 글 위, 폰 아래)을 3배로 찍어 1320×2868, &size=medium이면 402×874를 3배로 1206×2622
     - 듀오: 951×669 CSS 픽셀(넓은 화면 배치: 글 · 기기 좌우)을 3배로 찍어 2853×2007, 기기는 펼친 듀오 가로 화면
     웹사이트에 기능 카드가 없는 장면(처음 실행 · 바로 정리 · 월별 · 공유)은 첫 카드 모양에 그 장면의 글(소개 맨 위 · '이것도 할 수 있어요' 카드)을 넣습니다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: #fff; }
  iframe { display: block; border: 0; }
</style>
</head>
<body>
<iframe title="웹사이트"></iframe>
<script type="module">
import { characterById, toSVG } from '../characters.js'

const params = new URLSearchParams(location.search)
const lang = params.get('lang') || 'ko'
const scene = params.get('scene')
const duo = params.get('device') === 'duo'
// 바형 크기: large(6.9인치 1320×2868) · medium(6.3인치 1206×2622, App Store Connect 필수 칸)
const [W, H] = duo ? [951, 669] : params.get('size') === 'medium' ? [402, 874] : [440, 956]

// 웹사이트 기능 카드(제목 id)가 있는 장면
const FEATURES = { trips: 'f-trip', polish: 'f-polish', swipe: 'f-swipe', videos: 'f-video', room: 'f-room' }
// 기능 카드가 없는 장면: '이것도 할 수 있어요' 카드 차례 또는 소개 맨 위, 말풍선(한국어 원문, 번역은 i18n.json)
const OTHERS = {
  'first-run': { hero: true },
  quick: { extra: 0, char: 'rolly', line: '다 쓴 캡처부터 치워 봐요' },
  month: { extra: 1, char: 'pola', line: '이번 달은 다 끝냈어요!' },
  share: { extra: 2, char: 'chalkak', line: '여행 카드로 자랑해 봐요' }
}
const { langs, rows, store } = await (await fetch('i18n.json')).json()
const t = ko => {
  if (lang === 'ko') return ko
  const row = [...rows, ...store].find(r => r.ko === ko)
  if (!row || row[lang] === undefined) throw new Error(`번역 없음: ${ko}`)
  return row[lang]
}
const dir = lang === 'ko' ? '' : `${langs.find(l => l.code === lang).dir}/`

const frame = document.querySelector('iframe')
document.body.style.cssText = `width: ${W}px; height: ${H}px`
frame.width = W
frame.height = H
frame.src = `../${dir}index.html`
await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }))
const doc = frame.contentDocument

// 카드 고르기 · 만들기
let card
if (FEATURES[scene]) {
  card = doc.getElementById(FEATURES[scene]).closest('article')
} else {
  const other = OTHERS[scene]
  card = doc.getElementById(FEATURES.trips).closest('article').cloneNode(true)
  const copy = card.querySelector('.feature-copy')
  const h3 = copy.querySelector('h3')
  const bubble = copy.querySelector('.bubble')
  if (other.hero) {
    const heroBubble = doc.querySelector('.hero-bubble')
    h3.innerHTML = doc.getElementById('hero-title').innerHTML
    copy.querySelector('.problem').textContent = doc.querySelector('.hero .lead').textContent
    copy.querySelector('.answer').remove()
    bubble.innerHTML = heroBubble.innerHTML
  } else {
    const extra = doc.querySelectorAll('.extras-row > li')[other.extra]
    card.style.setProperty('--theme', extra.style.getPropertyValue('--theme'))
    h3.textContent = extra.querySelector('h3').textContent
    copy.querySelector('.problem').remove()
    copy.querySelector('.answer').textContent = extra.querySelector('p').textContent
    const name = { rolly: '롤리', pola: '폴라', chalkak: '찰칵' }[other.char]
    bubble.innerHTML = `<span class="who">${t(`>${name}<`).slice(1, -1)}</span>${t(other.line)}`
    copy.querySelector('.char').innerHTML = toSVG(characterById(other.char), {})
  }
}

// 카드 하나만 남기고 화면 크기에 맞춤(라이트 모드)
doc.documentElement.dataset.theme = 'light'
doc.body.replaceChildren(card)
card.querySelectorAll('.bubble').forEach(b => b.classList.add('is-in'))
const style = doc.createElement('style')
style.textContent = `
  html, body { overflow: hidden; }
  body { margin: 0; }
  .feature { box-sizing: border-box; min-height: 100vh; display: flex; align-items: center; }
  .feature > .wrap { width: 100%; }
  .feature .phone img { content-visibility: visible; }
  /* 캐릭터 카드의 덧붙인 문단은 스크린샷에서 넘쳐 뺍니다. */
  .feature .more { display: none; }
  ${duo ? `
  /* 듀오: 기기를 펼친 가로 화면으로, 글 칸 · 기기 칸을 좌우로 */
  .feature { padding: 0; }
  .feature > .wrap { box-sizing: border-box; max-width: none; padding: 0 48px; }
  .feature-grid { grid-template-columns: 1.5fr 1fr !important; gap: 44px !important; }
  .feature.flip .feature-grid { grid-template-columns: 1fr 1.5fr !important; }
  .feature .phone { width: 100%; }
  .feature .phone img { aspect-ratio: 2853 / 2007; border-radius: 26px; }
  ` : `
  /* 바형: 글 아래 폰은 화면 아래로 잘려 나가게 위에서부터 둡니다. */
  .feature { align-items: flex-start; padding-top: 56px; }
  .feature > .wrap { box-sizing: border-box; max-width: none; padding: 0 28px; }
  `}`
doc.head.append(style)
const img = card.querySelector('.phone img')
img.loading = 'eager'
img.src = params.get('shot')
await img.decode()
await doc.fonts.ready
document.body.dataset.ready = '1'
</script>
</body>
</html>
